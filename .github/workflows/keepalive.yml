name: Keep Supabase awake

# Free Supabase projects are paused after a week without enough database activity.
# This calls /api/health (which reads the database) once a day. Not needed on a paid plan.
on:
  schedule:
    - cron: '17 2 * * *' # 02:17 UTC every day
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Call the health check
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/health.json -w "%{http_code}" "${{ secrets.PRODUCTION_URL }}/api/health" || true)
            echo "attempt $i -> $code"
            if [ "$code" = "200" ]; then cat /tmp/health.json; exit 0; fi
            sleep 20
          done
          echo "Health check failed. The project may be paused: open the Supabase dashboard and press Resume."
          exit 1
